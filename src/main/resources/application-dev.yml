spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 엔티티 수정 시 테이블에 자동 반영되도록 update
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        physical_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

logging:
  level:
    org:
      springframework: INFO
      hibernate.SQL: DEBUG
      hibernate.type.descriptor.sql.BasicBinder: TRACE

external:
  youth-policy:
    base-url: ${YOUTH_POLICY_API_URL}
    api-key: ${YOUTH_POLICY_API_KEY}